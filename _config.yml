# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Jin Ma"
title: "Ph.D. Student"
institution: "Clemson University"
email: majinwakeup@gmail.com
photo: profile.png  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=UUPDTacAAAAJ&hl=en"
  github: "https://github.com/MaJinWakeUp"
  # researchgate: "https://www.researchgate.net/"  # add your ResearchGate profile to enable
  orcid: "https://orcid.org/0000-0002-4089-6898"
  twitter: ""
  linkedin: ""
  cv: "papers/cv.pdf"  # e.g., "papers/cv.pdf" — leave blank to hide the CV icon

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#1a7a6d"      # theme color for links and buttons
dark_mode: true              # show dark mode toggle in navbar
description: "Academic homepage of Jin Ma, Ph.D. student at Clemson University"
baseurl: ""
url: "https://majinwakeup.github.io"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about  
  - name: publications
  - name: teaching
  - name: service
  # Pages below are kept in the repo but hidden from the nav for now.
  # Uncomment any you want to show later (their page files still exist under _pages/).
  # - name: talks
  # - name: research
  # - name: software
  # - name: team
  # - name: blogs

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Ma
  first_name: [Jin]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
  - spec
  - setup.sh
  - tests
  - jest.config.js
  - AGENTS.md
  - UPGRADING.md
  - citesty.csl
