<nav class="navbar sticky-top navbar-expand-md">
  <div class="container" style="max-width: var(--container-max);">
    <a class="navbar-brand" href="{{ site.baseurl }}/">
      <svg class="d-inline-block align-text-top" width="24" height="24" viewBox="0 0 64 64" style="border-radius: 5px; margin-right: var(--space-2); margin-top: 1px;" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="{{ site.accent_color | default: '#1a7a6d' }}"/>
        <text x="32" y="44" font-family="Georgia,serif" font-size="30" font-weight="700" fill="white" text-anchor="middle">{{ site.name | truncate: 1, "" | escape }}{{ site.name | split: " " | last | truncate: 1, "" | escape }}</text>
      </svg>
      {{ site.name | escape }}
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ site.baseurl }}/">Home</a>
        </li>
        {% for nav in site.nav_pages %}
        <li class="nav-item">
          <a class="nav-link{% if page.url contains nav.name %} active{% endif %}" href="{{ site.baseurl }}/{{ nav.name }}">{{ nav.name | capitalize }}</a>
        </li>
        {% endfor %}
      </ul>
      <div class="navbar-actions d-flex align-items-center" style="gap: var(--space-2);">
        <button class="search-toggle" id="searchToggle" aria-label="Search site" aria-expanded="false" aria-controls="searchOverlay">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        {% if site.dark_mode %}
        <button class="theme-toggle" id="darkModeToggle" aria-label="Toggle dark mode">
          <span class="theme-toggle-thumb"></span>
          <span class="theme-toggle-icon theme-toggle-light" aria-hidden="true">
            <i class="fa-solid fa-sun"></i>
          </span>
          <span class="theme-toggle-icon theme-toggle-dark" aria-hidden="true">
            <i class="fa-solid fa-moon"></i>
          </span>
        </button>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<!-- Search overlay -->
<div class="search-overlay" id="searchOverlay">
<div class="search-modal">
<div class="search-input-wrapper">
<i class="fa-solid fa-magnifying-glass search-input-icon"></i>
<input type="text" class="search-input" id="searchInput" placeholder="Search pages..." autocomplete="off" aria-label="Search pages">
<kbd class="search-kbd">ESC</kbd>
</div>
<div class="search-results" id="searchResults" aria-live="polite"></div>
</div>
</div>
